appId: com.itti.tuti.smartaccess.dev
tags:
  - fase2
  - scan
env:
  E2E_QR_OK: ${E2E_QR_OK || '476f-9f91-3a9bf7bf9372'}
---
- runFlow: shared/launch.yaml
- runFlow: shared/login.yaml
- extendedWaitUntil:
    visible: 'Control de accesos'
    timeout: 30000
- runFlow:
    file: shared/scan.yaml
    env:
      QR_CODE: ${E2E_QR_OK}
- assertVisible: 'Acceso confirmado y quemado'
- assertVisible: 'Permitir el ingreso'
